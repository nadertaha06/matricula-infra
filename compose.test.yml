name: matricula-tests
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./scripts/init-tests.sh:/docker-entrypoint-initdb.d/init-tests.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq-test:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: tests
      RABBITMQ_DEFAULT_PASS: tests
      RABBITMQ_DEFAULT_VHOST: etapa2-tests
    ports: ["127.0.0.1:5672:5672"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 10s
      retries: 20
