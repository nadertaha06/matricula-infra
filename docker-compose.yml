name: matricula-infra
services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks: [rede]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-matricula}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [rede]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 20
  matricula-disciplinas:
    image: nadertaha06/matricula-disciplinas:${DISCIPLINAS_TAG:-latest}
    build: ../matricula-disciplinas
    container_name: matricula-disciplinas
    restart: unless-stopped
    env_file: ./runtime/disciplinas.env
    ports: ["8001:8001"]
    networks: [rede]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  matricula-solicitacoes:
    image: nadertaha06/matricula-solicitacoes:${SOLICITACOES_TAG:-latest}
    build: ../matricula-solicitacoes
    container_name: matricula-solicitacoes
    restart: unless-stopped
    env_file: ./runtime/solicitacoes.env
    ports: ["8002:8002"]
    networks: [rede]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  matricula-processamento:
    image: nadertaha06/matricula-processamento:${PROCESSAMENTO_TAG:-latest}
    build: ../matricula-processamento
    container_name: matricula-processamento
    restart: unless-stopped
    env_file: ./runtime/processamento.env
    ports: ["8003:8003"]
    networks: [rede]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
volumes:
  postgres_data:
  rabbitmq_data:
networks:
  rede:
    external: true
