# API Gateway: TLS, roteamento, limite de taxa, correlacao e remocao de credenciais internas.

# Limite por IP de cliente. Excesso recebe 429 sem chegar aos servicos.
limit_req_zone $binary_remote_addr zone=api_por_ip:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=painel_por_ip:10m rate=20r/s;
limit_req_status 429;

log_format gateway_json escape=json '{"hora":"$time_iso8601","request_id":"$request_id",'
    '"cliente":"$remote_addr","metodo":"$request_method","caminho":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duracao":$request_time,"servico":"$upstream_addr",'
    '"duracao_servico":"$upstream_response_time"}';

# Compressao dos arquivos do portal (o bundle JS cai de ~480 KB para ~145 KB).
# Respostas JSON da API ficam sem compressao.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript image/svg+xml;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Porta 80: somente o desafio ACME da renovacao e o redirecionamento para HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /health { default_type text/plain; return 200 'ok'; }
    location / { return 308 https://$host:8080$request_uri; }
}

# O Security Group da EC2 libera 80 e 8080, mas nao 443. A 8080 e a entrada
# publica; a 443 fica pronta para quando a porta for liberada.
server {
    listen 443 ssl;
    listen 8080 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/matricula-publico/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matricula-publico/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    # HTTP simples na porta TLS (links antigos http://IP:8080) recebe redirecionamento.
    error_page 497 =308 https://$host:$server_port$request_uri;
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log /var/log/nginx/access.log gateway_json;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-ID $request_id always;
    include /etc/nginx/conf.d/proxy-headers.inc;

    location = /health { default_type text/plain; return 200 'ok'; }
    location / {
        set $frontend matricula-frontend:80;
        proxy_pass http://$frontend;
    }
    location = /disciplinas { return 308 /api/disciplinas/; }
    location /disciplinas/ { return 308 /api$request_uri; }
    location = /api/disciplinas { return 308 /api/disciplinas/; }
    location = /solicitacoes { return 308 /api/solicitacoes/; }
    location /solicitacoes/ { return 308 /api$request_uri; }
    location = /api/solicitacoes { return 308 /api/solicitacoes/; }
    location = /processamento { return 308 /api/processamento/; }
    location /processamento/ { return 308 /api$request_uri; }
    location = /api/processamento { return 308 /api/processamento/; }

    location /api/ {
        limit_req zone=api_por_ip burst=100 nodelay;
        # Metricas sao coletadas pelo Prometheus na rede interna, nunca pelo gateway.
        location ~* ^/api/[^/]+/metrics(/|$) { return 404; }
        location /api/disciplinas/ {
            set $backend matricula-disciplinas:8001;
            rewrite ^/api/disciplinas/(.*)$ /$1 break;
            proxy_pass http://$backend;
        }
        location /api/solicitacoes/ {
            set $backend matricula-solicitacoes:8002;
            rewrite ^/api/solicitacoes/(.*)$ /$1 break;
            proxy_pass http://$backend;
        }
        location /api/processamento/ {
            set $backend matricula-processamento:8003;
            rewrite ^/api/processamento/(.*)$ /$1 break;
            proxy_pass http://$backend;
        }
        return 404;
    }

    location = /grafana { return 308 /grafana/; }
    location /grafana/ {
        limit_req zone=painel_por_ip burst=100 nodelay;
        set $grafana matricula-grafana:3000;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://$grafana;
    }
}

# Status do Nginx para o exporter do Prometheus. A porta 8081 nao e publicada:
# so a rede Docker interna alcanca este bloco.
server {
    listen 8081;
    server_name _;
    access_log off;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
