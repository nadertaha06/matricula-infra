server {
    listen 80;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /health { default_type text/plain; return 200 'ok'; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/matricula-publico/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matricula-publico/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_set_header X-Service-Token "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    location = /health { default_type text/plain; return 200 'ok'; }
    location / {
        set $frontend matricula-frontend:80;
        proxy_pass http://$frontend;
    }
}
