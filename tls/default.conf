# Porta 80: somente o desafio ACME da renovacao e o redirecionamento para HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /health { default_type text/plain; return 200 'ok'; }
    location / { return 308 https://$host:8080$request_uri; }
}

# O Security Group da EC2 libera 80 e 8080, mas nao 443. A 8080 e a entrada
# publica; a 443 fica pronta para quando a porta for liberada.
server {
    listen 443 ssl;
    listen 8080 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/matricula-publico/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matricula-publico/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    # HTTP simples na porta TLS (links antigos http://IP:8080) recebe redirecionamento.
    error_page 497 =308 https://$host:$server_port$request_uri;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_set_header X-Service-Token "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /health { default_type text/plain; return 200 'ok'; }
    location / {
        set $frontend matricula-frontend:80;
        proxy_pass http://$frontend;
    }
    location = /disciplinas { return 308 /api/disciplinas/; }
    location /disciplinas/ { return 308 /api$request_uri; }
    location = /api/disciplinas { return 308 /api/disciplinas/; }
    location = /solicitacoes { return 308 /api/solicitacoes/; }
    location /solicitacoes/ { return 308 /api$request_uri; }
    location = /api/solicitacoes { return 308 /api/solicitacoes/; }
    location = /processamento { return 308 /api/processamento/; }
    location /processamento/ { return 308 /api$request_uri; }
    location = /api/processamento { return 308 /api/processamento/; }
    location /api/disciplinas/ {
        set $backend matricula-disciplinas:8001;
        rewrite ^/api/disciplinas/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/solicitacoes/ {
        set $backend matricula-solicitacoes:8002;
        rewrite ^/api/solicitacoes/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/processamento/ {
        set $backend matricula-processamento:8003;
        rewrite ^/api/processamento/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
}
