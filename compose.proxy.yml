name: matricula-publico
services:
  proxy:
    image: nginx:1.28-alpine
    container_name: matricula-proxy
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [rede]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
networks:
  rede:
    external: true
