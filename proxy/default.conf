server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        default_type text/html;
        return 200 '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Sistema de Matricula</title><h1>Sistema de Matrícula em Disciplinas</h1><p>APIs da entrega 2</p><ul><li><a href="/disciplinas/docs">Disciplinas</a></li><li><a href="/solicitacoes/docs">Solicitações</a></li><li><a href="/processamento/docs">Processamento</a></li></ul></html>';
    }
    location = /health { default_type text/plain; return 200 'ok'; }
    location = /disciplinas { return 308 /disciplinas/; }
    location = /solicitacoes { return 308 /solicitacoes/; }
    location = /processamento { return 308 /processamento/; }
    location /disciplinas/ {
        set $backend matricula-disciplinas:8001;
        rewrite ^/disciplinas/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /solicitacoes/ {
        set $backend matricula-solicitacoes:8002;
        rewrite ^/solicitacoes/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /processamento/ {
        set $backend matricula-processamento:8003;
        rewrite ^/processamento/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
}
